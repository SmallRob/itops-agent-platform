services:
  agent-service:
    # 外部 Python Agent 服务（itops-agent-service）：远端 Agent Provider 的执行后端
    # 仅加入栈内网络，不发布宿主端口；后端经 AGENT_SERVICE_URL 以服务名直连
    build:
      context: ./itops-agent-service
      dockerfile: ../docker/Dockerfile.agent-service
    container_name: itops-agent-service
    networks:
      - itops-network
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${AGENT_SERVICE_LOG_LEVEL:-INFO}
      # LLM 配置兜底（后端启动时会用模型池默认模型覆盖同步；此处用于独立启动场景）
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
    volumes:
      # LLM 配置持久化（data/llm_config.json），容器重启自动恢复
      - agent-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  backend:
    # For local build
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # For using pre-built images from registry:
    # image: registry.cn-hangzhou.aliyuncs.com/huluwa666/tsq-images-hub:IT_Onlin-ITOps-backend-latest
    container_name: itops-backend
    networks:
      - itops-network
      # 宿主 nginx（tcb-front-nginx）所在网络：itops.leansoftx.com 域名的上游，
      # 加入后 nginx 可用容器名直连；已用 docker network create 预建，故为 external
      - tcb-front-nginx-network
    ports:
      - "19301:3001"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/app.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set for production deployment}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - DOUBAO_API_KEY=${DOUBAO_API_KEY:-}
      - DOUBAO_API_BASE=${DOUBAO_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-4o}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - LOCAL_AI_API_KEY=${LOCAL_AI_API_KEY:-}
      - LOCAL_AI_API_BASE=${LOCAL_AI_API_BASE:-}
      - LOCAL_AI_MODEL=${LOCAL_AI_MODEL:-}
      - WEBHOOK_VERIFY_ENABLED=${WEBHOOK_VERIFY_ENABLED:-false}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_IP_WHITELIST=${WEBHOOK_IP_WHITELIST:-}
      - ALERT_EMAIL_HOST=${ALERT_EMAIL_HOST:-}
      - ALERT_EMAIL_PORT=${ALERT_EMAIL_PORT:-587}
      - ALERT_EMAIL_USER=${ALERT_EMAIL_USER:-}
      - ALERT_EMAIL_PASS=${ALERT_EMAIL_PASS:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:80,http://localhost:3000,http://localhost:8080,http://itops-frontend,http://frontend}
      # Docker 资源管理（镜像/容器/卷/网络）
      - DOCKER_ENABLED=${DOCKER_ENABLED:-true}
      - DOCKER_SOCKET_PATH=${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      # Skills 插件目录（挂载宿主机目录即可动态插拔，无需重建镜像）
      - SKILLS_DIR=${SKILLS_DIR:-/app/skills}
      # Hook 入站令牌（外部事件源调用 /api/hooks/* 时携带）
      - HOOKS_TOKEN=${HOOKS_TOKEN:-}
      # 外部 Python Agent 服务（栈内服务名直连；远端 Agent Provider 的执行后端）
      - AGENT_SERVICE_URL=${AGENT_SERVICE_URL:-http://agent-service:8000}
      # 推理模型（如 deepseek-v4-flash）+ 工具循环耗时较长，放宽超时
      - AGENT_SERVICE_TIMEOUT=${AGENT_SERVICE_TIMEOUT:-120000}
      - AGENT_SERVICE_RETRIES=${AGENT_SERVICE_RETRIES:-2}
    volumes:
      - app-data:/app/data
      - app-backups:/app/backups
      # 本机 Docker Engine（只读接口；写操作在 API 层受控）
      # 注意：容器内以非 root 运行，entrypoint 会自动把 appuser 加入 socket 所属组
      - ${DOCKER_SOCKET_HOST_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # Skills 插件目录（外部挂载，支持不重建镜像的动态插拔）
      - ./skills:/app/skills
    depends_on:
      agent-service:
        condition: service_healthy
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Log driver with size limits
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    # For local build
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    # For using pre-built images from registry:
    # image: registry.cn-hangzhou.aliyuncs.com/huluwa666/tsq-images-hub:IT_Onlin-ITOps-frontend-latest
    container_name: itops-frontend
    networks:
      - itops-network
      # 同 backend：供宿主 nginx 以容器名反代
      - tcb-front-nginx-network
    ports:
      - "19300:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Log driver with size limits
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  itops-network:
    driver: bridge
  # 宿主 nginx（tcb-front-nginx）所在外部网络，用于域名反代到本栈
  # 若不存在，先执行：docker network create tcb-front-nginx-network
  tcb-front-nginx-network:
    external: true

volumes:
  app-data:
    driver: local
  app-backups:
    driver: local
  agent-data:
    driver: local